name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # The default GITHUB_TOKEN is read-only; creating releases and uploading
    # assets needs contents write access.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # dnlib is the only SDK-style project and needs its project assets file
      # generated before msbuild can compile it on a fresh clone.
      - name: Restore dnlib
        run: msbuild dnlib\src\dnlib.csproj /t:Restore /p:Configuration=Release /v:minimal /nologo

      - name: Build CLI (with all component assemblies)
        run: msbuild Confuser.CLI\Confuser.CLI.csproj /p:Configuration=Release /p:Platform=AnyCPU /v:minimal /nologo

      - name: Build Quick Tool
        run: msbuild Confuser.QuickTool\Confuser.QuickTool.csproj /p:Configuration=Release /p:Platform=AnyCPU /v:minimal /nologo

      - name: Verify required files
        shell: pwsh
        run: |
          $required = @(
            'Confuser.CLI.exe', 'Confuser.Core.dll', 'Confuser.Protections.dll',
            'Confuser.Renamer.dll', 'Confuser.DynCipher.dll', 'Confuser.Runtime.dll',
            'dnlib.dll', 'Confuser.QuickTool.exe', 'ConfuserExNG.targets',
            'ConfuserExRules.crproj'
          )
          foreach ($f in $required) {
            if (-not (Test-Path "Release\bin\$f")) {
              Write-Error "Required release file missing: Release\bin\$f"
            }
          }

      - name: Zip release folder
        shell: pwsh
        run: |
          $zip = 'ConfuserEx_bin.zip'
          if (Test-Path $zip) { Remove-Item $zip }
          $files = Get-ChildItem 'Release\bin' |
            Where-Object { $_.Name -ne 'confex-tmp' -and $_.Name -notlike '*.confex-stamp' }
          Compress-Archive -Path $files.FullName -DestinationPath $zip
          Get-ChildItem $zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConfuserEx_bin
          path: ConfuserEx_bin.zip

      - name: Attach zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ConfuserEx_bin.zip
          generate_release_notes: true

      # Manual runs have no tag, so they update a rolling pre-release instead.
      # The tag "latest" is (re)created at the current master commit on every run.
      - name: Update latest build pre-release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (master)
          body: |
            Automatically updated build of master. Download `ConfuserEx_bin.zip`, unzip it anywhere and run — see the README for usage.

            For versioned releases, check the [regular releases](https://github.com/uxmanz/ConfuserExNG/releases).
          files: ConfuserEx_bin.zip
          prerelease: true
          make_latest: false
