# Continuous integration: builds the shippable tools on every push/PR to
# master and uploads the release folder as a build artifact.
#
# Releasing is automatic too: pushing a v* tag runs .github/workflows/release.yml,
# which builds the same way and attaches ConfuserEx_bin.zip to a GitHub release.
#
# The legacy WPF GUI (ConfuserEx\ConfuserEx.csproj) is deliberately not built
# here; it needs old NuGet packages and is not part of the release zip.

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # dnlib is the only SDK-style project and needs its project assets file
      # generated before msbuild can compile it on a fresh clone.
      - name: Restore dnlib
        run: msbuild dnlib\src\dnlib.csproj /t:Restore /p:Configuration=Release /v:minimal /nologo

      - name: Build CLI (with all component assemblies)
        run: msbuild Confuser.CLI\Confuser.CLI.csproj /p:Configuration=Release /p:Platform=AnyCPU /v:minimal /nologo

      - name: Build Quick Tool
        run: msbuild Confuser.QuickTool\Confuser.QuickTool.csproj /p:Configuration=Release /p:Platform=AnyCPU /v:minimal /nologo

      - name: Verify required files
        shell: pwsh
        run: |
          $required = @(
            'Confuser.CLI.exe', 'Confuser.Core.dll', 'Confuser.Protections.dll',
            'Confuser.Renamer.dll', 'Confuser.DynCipher.dll', 'Confuser.Runtime.dll',
            'dnlib.dll', 'Confuser.QuickTool.exe', 'ConfuserExNG.targets',
            'ConfuserExRules.crproj'
          )
          foreach ($f in $required) {
            if (-not (Test-Path "Release\bin\$f")) {
              Write-Error "Required release file missing: Release\bin\$f"
            }
          }

      - name: Smoke test CLI
        shell: cmd
        run: |
          Release\bin\Confuser.CLI.exe | findstr /C:"Usage:" || exit /b 1

      - name: Zip build output
        shell: pwsh
        run: |
          $zip = 'ConfuserEx_bin.zip'
          if (Test-Path $zip) { Remove-Item $zip }
          $files = Get-ChildItem 'Release\bin' |
            Where-Object { $_.Name -ne 'confex-tmp' -and $_.Name -notlike '*.confex-stamp' }
          Compress-Archive -Path $files.FullName -DestinationPath $zip
          Get-ChildItem $zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConfuserEx_bin
          path: ConfuserEx_bin.zip
